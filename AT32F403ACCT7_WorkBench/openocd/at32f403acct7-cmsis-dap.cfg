# Flash Pro(CMSIS-DAP) + Artery AT32F403ACCT7 over SWD.

source [find interface/cmsis-dap.cfg]
transport select swd

# This board reports the Cortex-M4 SW-DP ID as 0x2ba01477.
set CPUTAPID 0x2ba01477
set CHIPNAME at32f403acct7
set WORKAREASIZE 0x8000

source [find target/artery/at32f4x.cfg]

adapter speed 1000
reset_config srst_nogate
cortex_m reset_config sysresetreq
