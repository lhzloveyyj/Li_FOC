# Recovery flashing config for AT32F403ACCT7 + CMSIS-DAP.
# Use a slow SWD clock and assert NRST while connecting so the running firmware
# cannot reconfigure peripherals or keep the core busy before OpenOCD halts it.

source [find interface/cmsis-dap.cfg]
transport select swd

adapter speed 100
reset_config srst_only srst_nogate connect_assert_srst
adapter srst delay 100
adapter srst pulse_width 100

set CPUTAPID 0x2ba01477
set CHIPNAME at32f403acct7
set WORKAREASIZE 0x8000

source [find target/artery/at32f4x.cfg]
